{% extends 'base.html' %}{% block title %}{{ product['name'] }}{% endblock %}{% block content %}
<div class="two"><img src="{{ product['image'] }}" alt="{{ product['name'] }}"><div>
<div class="cat">{{ product['category'] }}</div><h1>{{ product['name'] }}</h1><p class="price total">₹{{ '%.0f'|format(product['price']) }}</p>
<p>{{ product['description'] }}</p>
<form method="post" action="{{ url_for('add_to_cart', product_id=product['id']) }}"><button class="btn">Add to cart</button></form></div></div>{% endblock %}
