<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Glowora{% endblock %} | Glowora Beauty</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body>
<header><div class="wrap"><a class="logo" href="{{ url_for('home') }}">Glowora</a>
<nav><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('shop') }}">Shop</a>
<a href="{{ url_for('cart') }}">Cart<span class="badge">{{ cart_count|default(0) }}</span></a>
{% if session.get('customer_id') %}<a href="{{ url_for('customer_account') }}">Account</a><a href="{{ url_for('customer_logout') }}">Logout</a>
{% else %}<a href="{{ url_for('customer_login') }}">Login</a><a href="{{ url_for('customer_register') }}">Register</a>{% endif %}</nav></div></header>
<main class="wrap">{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}{% block content %}{% endblock %}</main>
<footer>&copy; Glowora Beauty. Made with care.</footer></body></html>
