{% extends 'admin_base.html' %}{% block title %}Add product{% endblock %}{% block admin %}
<form class="panel narrow" method="post" enctype="multipart/form-data" style="margin:0 auto"><h1>Add product</h1><label>Name</label><input name="name" required><label>Category</label><input name="category" required>
<label>Price (₹)</label><input name="price" type="number" step="0.01" min="1" required><label>Description</label><textarea name="description" rows="3" required></textarea>
<label>Image (JPG, PNG, WEBP, max 5MB)</label><input type="file" name="image_file" accept=".jpg,.jpeg,.png,.webp" required><br><br><button class="btn">Add product</button></form>{% endblock %}
